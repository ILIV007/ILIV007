<style>

<script>
'use strict';
const $=s=>document.querySelector(s);
const out=$('#output'),kbd=$('#kbd'),lineEl=$('#line'),ghostEl=$('#ghost'),ps1El=$('#ps1'),pl=$('#promptline');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const state={cwd:[],prev:null,history:[],hIdx:null,draft:'',buf:'',theme:'neon',crt:true,sound:false,busy:false,vim:false,boot:Date.now(),tip:false};
(function(){const t=store.get('t.theme','neon');if(['neon','azure','void'].includes(t))state.theme=t;
state.crt=store.get('t.crt','1')==='1';state.sound=store.get('t.snd','0')==='1';
try{state.history=JSON.parse(store.get('t.hist','[]'))||[]}catch(e){}})();

const FS={
'about.md':{md:"You are `guest`. No account, no cookie banner, no popup.\n\n# ILIV007\n\nDeveloper. Terminal apologist. Professional complicator-remover.\n\nI write software the way I like my shells: fast, quiet, honest about what it does.\n\n## Principles\n\n- Complexity is a loan. Interest compounds nightly.\n- If it needs a dashboard to explain itself, it already failed.\n- The best interface is still a blinking cursor and a contract.\n- Delete more than you write. Git remembers anyway.\n\n## Contact\n\n- **github:** https://github.com/ILIV007\n- **email:** ILIV007@proton.me\n- **telegram:** @ILIVIR3\n- **website:** https://ilivir3.pages.dev/\n\nOr type `links` for a clickable list. Or `mail` to compose right here.\n\nThis entire site is one HTML file. View source."},
terminal:{
'why-i-still-use-vim.md':{md:"# Why I Still Use Vim\n\n*2025-11-02 - terminal - 4 min*\n\nPeople ask if I use Vim to be faster. Nobody asks if I use it to be *left alone*, which is the real answer.\n\nAfter enough years, the editor stops being a program and becomes a reflex. `ciw` means *this word is already gone*. You stop thinking about it, which is the entire point.\n\nThe learning curve is real, and I am keeping it. The curve is a moat around my attention. Every few years I try the shiny new editor and for nine days I am a believer, then I open a terminal instead.\n\nLearn one tool deeply enough that it stops being a tool. Depth is the only thing that pays compounding interest. Vim is where I dug."},
'the-terminal-is-a-place.md':{md:"# The Terminal Is a Place\n\n*2025-10-18 - terminal - 5 min*\n\nThe modern web is a shopping mall. This blog is a basement with good lighting and one chair, and the chair is yours.\n\nA prompt is the most honest interface humans have built:\n\n> you say exactly what you want, and it does exactly that.\n\nThere is no dark pattern you can weave into a text cursor. `ls` to look around. `cat` to read. Nothing tracks you, because nothing here can. The terminal does not want your engagement. It is just glad you stopped by."}},
web:{
'one-file-is-enough.md':{md:"# One File Is Enough\n\n*2025-10-05 - web - 5 min*\n\nThis blog weighs less than most hero images. One HTML file. No framework, no build step, no `node_modules`.\n\nEvery dependency is a promise that a stranger will keep being competent for the lifetime of your project.\n\nMost of the web is *documents*. Shipping a document as a SPA is mailing a letter with a forklift:\n\n- it cannot break on a CDN hiccup\n- it cannot have a vulnerable dependency\n- it will still render in 2040\n\nEverything here lives in one file you can save with Ctrl+S and own forever."},
'tabs-vs-spaces.md':{md:"# Tabs vs Spaces: The Final Answer\n\n*2025-09-30 - web - 2 min*\n\nNeither. The robots won. Formatters came through like a peacekeeping force nobody voted for and everybody secretly likes.\n\nWe took the one decision with zero consequences and made it a personality test, while ignoring decisions with actual consequences.\n\n1. Pick a formatter. Coin flip is fine.\n2. Wire it to CI. Never think again.\n3. Redirect the energy toward naming things.\n\nNow go be opinionated about something that matters."}},
meta:{
'how-this-blog-works.md':{md:"# How This Blog Works\n\n*2025-11-10 - meta - 3 min*\n\nThe whole site is one HTML file pretending to be an OS. Directories are objects, files hold markdown.\n\n## The bits I am proud of\n\n- The cursor blinks every **1.06s**\n- Tab-completion previews as *ghost text*\n- Keypress audio is synthesized live with Web Audio\n- Scanlines: three positioned divs\n\n## Deliberately dumb\n\n- `rm` always refuses\n- `sudo` reports you to /dev/null\n- `exit` does not. You are already home.\n\nThere are games hidden in here too. `rm -rf /` is one way to find the easter egg."}},
projects:{
'tty-blog.md':{md:"# tty-blog\n\n*2025-11-12 - the blog you are inside*\n\nA developer blog that behaves like a TTY: prompt at the bottom, history in the arrow keys, tab-completion with ghost text, a CRT overlay, and a snake game.\n\n- **stack:** one HTML file\n- **commands:** ls, cat, cd, whoami, mail, help, snake, matrix, wpm\n- **status:** shipping"},
'dotfiles.md':{md:"# dotfiles\n\n*2025-08-21 - chronically public*\n\n- **vim** -- 11 lines\n- **tmux** -- prefix is Ctrl-a\n- **git** -- `git yolo` does push-force-with-lease\n\nClone: https://github.com/ILIV007/dotfiles"},
'neon.md':{md:"# neon\n\n*2025-07-04 - tiny, on purpose*\n\nA ~2KB CSS kit that makes any page glow: neon purple on black, electric blue accents.\n\n- **themes:** neon, azure, void\n- **api:** `--p1`, `--p2`, `--dim`\n\nThis blog runs on it."}}
};
FS.posts={};for(const d of['terminal','web','meta'])for(const k in FS[d])FS.posts[k]=FS[d][k];
const isFile=n=>n&&typeof n==='object'&&'md'in n;
const isDir=n=>n&&typeof n==='object'&&!('md'in n);
function resolve(p){const parts=String(p).replace(/^~\/?/,'').split('/').filter(x=>x&&x!=='.');
const st=[...state.cwd];for(const s of parts){if(s==='..')st.pop();else st.push(s);}
let n=FS;for(const s of st){if(isDir(n))n=n[s];else return null;}
return n?{node:n,segs:st}:null;}
const cwdPath=()=>'~'+(state.cwd.length?'/'+state.cwd.join('/'):'');

function inline(s){s=esc(s);const st=[];const keep=h=>{st.push(h);return'\x00'+(st.length-1)+'\x00'};
s=s.replace(/`([^`]+)`/g,(m,c)=>keep('<code>'+c+'</code>'));
s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,(m,a,u)=>a+keep('<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'));
s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
return s.replace(/\x00(\d+)\x00/g,(m,i)=>st[+i]);}
function mdRender(src){const L=src.split('\n');let h='',i=0,p=[];
const cp=()=>{if(p.length){h+='<p>'+p.join('<br>')+'</p>';p=[]}};
while(i<L.length){const l=L[i];
if(/^\s*~{3,}/.test(l)){cp();i++;const c=[];while(i<L.length&&!/^\s*~{3,}/.test(L[i]))c.push(L[i++]);i++;h+='<pre>'+esc(c.join('\n'))+'</pre>';continue;}
const m=l.match(/^(#{1,2})\s+(.*)/);
if(m){cp();h+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>';i++;continue;}
if(/^\s*>/.test(l)){cp();const q=[];while(i<L.length&&/^\s*>/.test(L[i]))q.push(L[i++].replace(/^\s*>\s?/,''));h+='<blockquote>'+inline(q.join(' '))+'</blockquote>';continue;}
if(/^\s*[-*]\s+/.test(l)){cp();const it=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i]))it.push('<li>'+inline(L[i++].replace(/^\s*[-*]\s+/,''))+'</li>');h+='<ul>'+it.join('')+'</ul>';continue;}
if(/^\s*\d+\.\s+/.test(l)){cp();const it=[];while(i<L.length&&/^\s*\d+\.\s+/.test(L[i]))it.push('<li>'+inline(L[i++].replace(/^\s*\d+\.\s+/,''))+'</li>');h+='<ol>'+it.join('')+'</ol>';continue;}
if(!l.trim()){cp();i++;continue;}
p.push(inline(l));i++;}
cp();return h;}

function print(t,c){const d=document.createElement('div');d.className='line'+(c?' '+c:'');d.innerHTML=t||'&nbsp;';out.appendChild(d);scroll();return d;}
function printMD(md){const d=document.createElement('div');d.className='md';d.innerHTML=mdRender(md);out.appendChild(d);scroll(true);}
function err(t){blip('err');print('<span class="err"><b>error:</b> '+esc(t)+'</span>');}
function scroll(f){if(f||out.scrollHeight-out.scrollTop-out.clientHeight<160)out.scrollTop=out.scrollHeight;}
let skip=false;
async function typeLines(a,d){skip=false;for(const[t,c]of a){if(c==='err')err(t);else print(t,c);scroll(true);if(d&&!skip)await sleep(d);}}
const ps1=()=>'<span class="p-u">guest@iliv007</span><span class="p-d">:</span><span class="p-p">'+esc(cwdPath())+'</span><span class="p-u">$ </span>';
function echo(v,s){print(ps1()+'<span class="cmd">'+esc(v)+'</span>'+(s||''));}
function updPs1(){ps1El.innerHTML=ps1();$('#bar-cwd').textContent=cwdPath();}

let AC=null;
function blip(k){if(!state.sound)return;
try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){return;}
const t=AC.currentTime;
if(k==='key'||k==='enter'){const n=Math.max(1,AC.sampleRate*(k==='enter'?.05:.03)|0);
const b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
const s=AC.createBufferSource();s.buffer=b;
const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1200+Math.random()*1500;
const g=AC.createGain();g.gain.value=.09;
s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);
}else if(k==='err'){const o=AC.createOscillator(),g=AC.createGain();
o.type='square';o.frequency.value=150;g.gain.value=.04;
o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.15);}}

const CMDS=['about','cat','cd','clear','coffee','cowsay','crt','date','echo','exit','fortune','gh','git','hack','help','history','links','ls','mail','man','matrix','neofetch','party','ping','ps','pwd','rm','sl','snake','sound','sudo','theme','topics','uptime','vim','whoami','wpm','xyzzy'];
function sync(){state.buf=kbd.value;render();}
function render(){const v=state.buf,pos=Math.min(kbd.selectionStart==null?v.length:kbd.selectionStart,v.length);
lineEl.innerHTML=esc(v.slice(0,pos))+'<span class="cur">'+esc(v[pos]||' ')+'</span>'+esc(v.slice(pos+1));
ghostEl.textContent=ghost();}
function tokOf(v){const m=v.match(/(\S*)$/);return{tok:m[1],before:v.slice(0,v.length-m[1].length),first:!v.trim()};}
function cands(tok,first){let pre='',base=tok;const si=tok.lastIndexOf('/');
if(si>=0){pre=tok.slice(0,si+1);base=tok.slice(si+1);}
const r=resolve(pre||'.');if(!r||!isDir(r.node))return[];
let c=Object.keys(r.node).filter(k=>k.startsWith(base));
if(first&&!pre)c=c.concat(CMDS.filter(k=>k.startsWith(base)));
return[...new Set(c)].sort();}
function pref(a){let p=a[0];for(const s of a){let i=0;while(i<p.length&&p[i]===s[i])i++;p=p.slice(0,i);}return p;}
function ghost(){const v=state.buf;if(!v||state.busy)return'';
const{tok,first}=tokOf(v);
if(tok){const si=tok.lastIndexOf('/'),base=si>=0?tok.slice(si+1):tok,pre=si>=0?tok.slice(0,si+1):'';
const c=cands(tok,first);
if(c.length===1){const suf=c[0].slice(base.length);
if(suf){const isCmd=first&&CMDS.includes(c[0]);
const r=resolve(pre+c[0]);const isD=!isCmd&&r&&isDir(r.node);
return suf+(isCmd?' ':(isD?'/':' '));}}
else if(c.length>1){const cp=pref(c);if(cp.length>base.length)return cp.slice(base.length);}}
for(let i=state.history.length-1;i>=0;i--){const h=state.history[i];
if(h!==v&&h.startsWith(v)&&/\S/.test(v))return h.slice(v.length);}
return'';}
function accept(){const g=ghostEl.textContent;if(!g)return;kbd.value+=g;kbd.setSelectionRange(kbd.value.length,kbd.value.length);sync();}
function tab(){const v=kbd.value;if(!v)return;
if(ghostEl.textContent){accept();return;}
const{tok,before,first}=tokOf(v);if(!tok)return;
const c=cands(tok,first);if(!c.length)return;
const si=tok.lastIndexOf('/'),pre=si>=0?tok.slice(0,si+1):'',base=si>=0?tok.slice(si+1):tok;
if(c.length===1){const isCmd=first&&CMDS.includes(c[0]);
const r=resolve(pre+c[0]);const isD=!isCmd&&r&&isDir(r.node);
kbd.value=before+c[0]+(isCmd?' ':(isD?'/':' '));

REG.uptime=()=>{const s=((Date.now()-state.boot)/1000)|0;
  print('up '+Math.floor(s/60)+'m '+(s%60)+'s · 1 user · load average: 0.42, 0.17, 3 deadlines');};
REG.xyzzy=()=>print('A hollow voice says: "fool."','dim');
REG.coffee=async()=>{
  state.busy=true;skip=false;
  print('<pre style="white-space:pre;color:var(--p2)">'+esc([
  '     ( (','      ) )','   ........','   |      |]','   \\      /',"    `----'"].join('\n'))+'</pre>');
  for(const d of ['brewing .','brewing ..','brewing ...','brewing ....']){print(d,'dim');scroll(true);if(!skip)await sleep(380);}
  print('coffee ready. productivity +40%. deadline: unchanged.','dim');
  state.busy=false;
};
const KON_EP=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let ki_ep=0;
window.addEventListener('keydown',e=>{
  if(SG_EP||WPM_EP||MX_EP)return;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  ki_ep=(k===KON_EP[ki_ep])?ki_ep+1:(k===KON_EP[0]?1:0);
  if(ki_ep===KON_EP.length){ki_ep=0;
    blip('enter');
    print('<span style="color:var(--hi);font-weight:700;letter-spacing:.3em">K O N A M I</span>');
    document.body.classList.add('party-on');
    setTimeout(()=>{document.body.classList.remove('party-on');
      print('cheat accepted: +30 lives. spend them on the deadline.','dim');},4000);
  }
});
</script>
