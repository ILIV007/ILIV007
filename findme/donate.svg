<svg xmlns="http://www.w3.org/2000/svg" width="200" height="64" viewBox="0 0 200 64">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141428"/>
      <stop offset="1" stop-color="#07070e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- glass panel -->
  <rect x="1" y="1" width="198" height="62" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.08"/>
  <polygon points="20,1 70,1 40,63 8,63" fill="#ffffff" opacity="0.03"/>
  <!-- neon tube frame + icon + lettering, buzzing together -->
  <g filter="url(#glow)"><animate attributeName="opacity" values="1;0.62;1;0.86;1;0.72;1" keyTimes="0;0.18;0.32;0.5;0.66;0.82;1" begin="2.4s" dur="4.2s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="7" y="7" width="186" height="50" rx="8" fill="none" stroke="#ffc861" stroke-width="1.5"/>
