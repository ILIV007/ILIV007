    <text x="50" y="31" font-family="'Courier New', monospace" font-size="13" font-weight="bold" letter-spacing="2" fill="#ffffff">DONATE</text>
  </g>
  <text x="50" y="47" font-family="'Courier New', monospace" font-size="9" letter-spacing="0.5" fill="#94a3b8">donate-iv.pages.dev</text>
