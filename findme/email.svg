<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.72;1" begin="1.2s" dur="2.8s" repeatCount="indefinite"/>
    <g transform="translate(20,6)" fill="none" stroke="#b388ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 5L2 7"/></g>
  </g>
  <text x="32" y="52" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" letter-spacing="1" fill="#8b85b8">EMAIL</text>
  <title>EMAIL</title>
</svg>
