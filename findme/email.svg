<svg xmlns="http://www.w3.org/2000/svg" width="200" height="48" viewBox="0 0 200 48">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="198" height="46" rx="12"/></clipPath>
  </defs>
  <rect x="1" y="1" width="198" height="46" rx="12" fill="#0d0d18" stroke="#b388ff" stroke-width="1.5" stroke-opacity="0.8"/>
  <g clip-path="url(#clip)">
    <rect x="-80" y="-10" width="70" height="68" fill="url(#shine)" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" values="-90,0; 290,0" begin="1.5s" dur="3.2s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>
  <text x="30" y="31" text-anchor="middle" font-size="18" fill="#b388ff">✉</text>
  <text x="52" y="30" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#e8e6f5">Email</text>
  <circle cx="188" cy="24" r="3" fill="#b388ff">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <title>Email</title>
</svg>
